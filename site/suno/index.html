<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suno 키워드 레퍼런스</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{height:4px;width:4px;background:#1c1c1c}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
:root{
  --bg:#111;--bg2:#181818;--bg3:#1a1a1a;--bg4:#202020;
  --border:#242424;--border2:#2e2e2e;
  --text:#e0d8cc;--text2:#bbb;--muted:#666;--muted2:#555;
  --accent:#c8a97e;
  --danger-bg:#1e1212;--danger-border:#3a1818;--danger-text:#d07777;
  --info-bg:#101820;--info-border:#1a3040;--info-text:#88b8d0;
  --panel-w:300px;
}
body{font-family:'DM Mono','Courier New',monospace;background:var(--bg);color:var(--text);min-height:100vh}
#app{display:flex;min-height:100vh}
#main{flex:1;min-width:0;padding-bottom:80px}
#header{background:var(--bg2);border-bottom:1px solid var(--border);padding:18px 20px 0;position:sticky;top:0;z-index:100}
#header-inner{max-width:900px;margin:0 auto}
.header-meta{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.header-meta span:first-child{font-size:10px;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}
.header-meta span:last-child{font-size:10px;color:var(--accent);letter-spacing:.12em}
h1{font-size:20px;font-weight:700;color:#f0e8dd;letter-spacing:-.02em;margin-bottom:14px}
#search-input{width:100%;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;padding:8px 14px;color:var(--text);font-size:12px;outline:none;font-family:inherit;margin-bottom:14px;transition:border-color .15s}
#search-input:focus{border-color:var(--accent)}
#tab-bar{display:flex;flex-wrap:wrap;gap:2px;padding-bottom:4px}
.tab-btn{background:transparent;color:var(--muted);border:none;border-radius:5px 5px 0 0;padding:6px 11px;font-size:11px;cursor:pointer;font-family:inherit;font-weight:400;white-space:nowrap;transition:all .12s;flex-shrink:0}
.tab-btn.active{color:#111;font-weight:700}
.tab-btn:hover:not(.active){color:var(--text2)}
#content{max-width:900px;margin:0 auto;padding:22px 20px 0}
.tab-desc{font-size:12px;color:var(--muted);margin-bottom:20px}
.group{margin-bottom:28px}
.group-header{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.group-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;flex-shrink:0}
.group-note{font-size:10px;color:var(--muted2);font-style:italic}
.group-divider{flex:1;height:1px;background:#1e1e1e}
.group-add-btn{background:none;border:none;color:#3a3a3a;cursor:pointer;font-size:16px;padding:0 2px;line-height:1;transition:color .12s;font-family:inherit}
.group-add-btn:hover{color:#888}
.tag-list{display:flex;flex-wrap:wrap;gap:6px}
.tag-wrap{display:inline-flex;align-items:stretch;gap:0;border-radius:5px;overflow:hidden}
.tag-main{display:flex;align-items:center;border-radius:5px 0 0 5px;border:1px solid #252525;border-right:none;background:var(--bg3);cursor:pointer;font-family:inherit;transition:all .12s;outline:none;padding:4px 10px}
.tag-main:hover{border-color:#555}
.tag-main.selected{outline:2px solid var(--accent);outline-offset:1px}
.tag-main.danger{background:var(--danger-bg);border-color:var(--danger-border)}
.tag-main.info{background:var(--info-bg);border-color:var(--info-border)}
.tag-main.custom{border-style:dashed}
.tag-en{font-size:12px;white-space:nowrap;color:var(--text2)}
.tag-main.danger .tag-en{color:var(--danger-text)}
.tag-main.info .tag-en{color:var(--info-text)}
.tag-main.selected .tag-en{color:var(--accent)}
.tag-ko{display:flex;align-items:center;padding:4px 8px;font-size:10px;color:#888;background:#161616;border:1px solid #2a2a2a;border-left:1px solid #222;border-radius:0 5px 5px 0;white-space:nowrap;cursor:default;user-select:none;transition:color .12s}
.tag-main:hover+.tag-ko,.tag-main.selected+.tag-ko{color:#aaa}
.tag-main.danger+.tag-ko{color:#a05555;border-color:var(--danger-border);background:#160e0e}
.tag-main.info+.tag-ko{color:#6090a8;border-color:var(--info-border);background:#0c1420}
.tag-delete-btn{background:none;border:none;color:#444;cursor:pointer;font-size:11px;padding:1px 4px;line-height:1;font-family:inherit;transition:color .1s;align-self:center;margin-left:2px}
.tag-delete-btn:hover{color:var(--danger-text)}
.search-badge{margin-left:6px;font-size:9px;opacity:.45}
.search-count{font-size:11px;color:var(--muted2);margin-bottom:14px;letter-spacing:.12em}
.no-results{color:var(--muted2);font-size:13px;padding:20px 0}
.add-form{display:flex;gap:6px;margin-top:10px}
.add-input{background:#1a1a1a;border:1px solid var(--border2);border-radius:5px;padding:5px 10px;color:var(--text);font-size:12px;font-family:inherit;outline:none;width:200px}
.add-submit{color:#111;border:none;border-radius:5px;padding:5px 12px;font-size:12px;cursor:pointer;font-weight:700;font-family:inherit}
#builder{width:var(--panel-w);flex-shrink:0;background:#141414;border-left:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
#builder-header{padding:16px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
#builder-title{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2px}
#builder-sub{font-size:10px;color:var(--muted)}
#builder-tags{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.builder-empty{font-size:11px;color:#333;text-align:center;margin-top:30px;line-height:1.8}
.builder-chip{display:flex;align-items:center;background:#1c1c1c;border:1px solid #2a2a2a;border-radius:5px;padding:5px 8px 5px 10px;gap:6px;animation:chipIn .15s ease}
@keyframes chipIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}
.builder-chip .chip-en{font-size:11px;color:var(--text2);flex:1;word-break:break-all}
.builder-chip .chip-ko{font-size:10px;color:#555;flex-shrink:0;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.builder-chip-remove{background:none;border:none;color:#3a3a3a;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;flex-shrink:0;transition:color .1s;font-family:inherit}
.builder-chip-remove:hover{color:var(--danger-text)}
.builder-chip-drag{color:#2e2e2e;font-size:12px;cursor:grab;flex-shrink:0;user-select:none;padding:0 2px}
.builder-chip.dragging{opacity:.4}
#builder-footer{flex-shrink:0;border-top:1px solid var(--border);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
#builder-preview{background:#0e0e0e;border:1px solid #232323;border-radius:5px;padding:8px 10px;font-size:11px;color:#555;min-height:52px;line-height:1.7;word-break:break-all;max-height:90px;overflow-y:auto}
#builder-preview.has-content{color:var(--text2)}
#builder-actions{display:flex;gap:6px}
.btn-copy-all{flex:1;background:var(--accent);color:#111;border:none;border-radius:5px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .12s;letter-spacing:.04em}
.btn-copy-all:hover{opacity:.85}
.btn-copy-all:disabled{opacity:.3;cursor:not-allowed}
.btn-clear{background:#1e1e1e;color:var(--muted);border:1px solid #2a2a2a;border-radius:5px;padding:7px 10px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s}
.btn-clear:hover{color:var(--danger-text);border-color:var(--danger-border)}
.btn-clear:disabled{opacity:.3;cursor:not-allowed}
#sep-row{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.sep-btn{background:#1e1e1e;border:1px solid #2a2a2a;color:var(--muted2);border-radius:4px;padding:2px 7px;font-size:10px;cursor:pointer;font-family:inherit;transition:all .12s}
.sep-btn.active{background:#2a2a2a;color:var(--text2);border-color:#3a3a3a}
#builder-count{font-size:10px;color:var(--muted);text-align:right;margin-top:-2px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#111;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.04em;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:999}
#toast.show{opacity:1}
.mode-toggle{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.mode-btn{flex:1 1 140px;background:var(--bg3);border:1px solid #2a2a2a;color:var(--text2);border-radius:6px;padding:8px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .12s;font-weight:500}
.defaults-toggle{display:flex;align-items:center;gap:7px;margin-bottom:14px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
.defaults-toggle input{cursor:pointer}
.mode-btn:hover{border-color:#555}
.mode-btn.active{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.fusion-info{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);margin-bottom:16px;background:var(--bg3);border:1px solid #2a2a2a;border-radius:6px;padding:9px 12px}
.fusion-reroll-btn{margin-left:auto;background:#1e1e1e;border:1px solid #2a2a2a;color:var(--accent);border-radius:5px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .12s;white-space:nowrap}
.fusion-reroll-btn:hover{border-color:var(--accent)}
.genre-picker{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.genre-chip{background:var(--bg3);border:1px solid #2a2a2a;color:var(--text2);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .12s}
.genre-chip:hover{border-color:#555}
.genre-chip.active{color:#111;font-weight:700}
#shuffle-btn{display:block;background:var(--accent);color:#111;border:none;border-radius:6px;padding:11px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.04em;transition:opacity .12s;margin-bottom:22px}
#shuffle-btn:hover{opacity:.85}
.combo-category{margin-bottom:18px}
.combo-cat-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.combo-cat-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.combo-cat-btns{display:flex;gap:2px;margin-left:auto}
.combo-icon-btn{background:none;border:none;color:#444;cursor:pointer;font-size:13px;padding:2px 5px;transition:color .12s;font-family:inherit;line-height:1}
.combo-icon-btn:hover{color:var(--accent)}
.combo-icon-btn.locked{color:var(--accent)}
.combo-actions{display:flex;gap:8px;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}
.btn-combo-add{flex:1;background:var(--accent);color:#111;border:none;border-radius:5px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.03em;transition:opacity .12s}
.btn-combo-add:hover{opacity:.85}
.btn-combo-copy{flex:1;background:#1e1e1e;color:var(--text2);border:1px solid #2a2a2a;border-radius:5px;padding:10px 14px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .12s}
.btn-combo-copy:hover{color:var(--accent);border-color:var(--accent)}
.jjhl-backbar{background:#0c0c0c;border-bottom:1px solid #242424;padding:8px 20px;font-family:'DM Mono','Courier New',monospace}
.jjhl-backbar a{color:var(--accent);text-decoration:none;font-size:11px;letter-spacing:.08em;font-weight:700}
.jjhl-backbar a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="jjhl-backbar"><a href="../index.html">&#8592; JJHL 홈으로</a></div>
<div id="app">
  <div id="main">
    <div id="header">
      <div id="header-inner">
        <div class="header-meta"><span>Suno Prompt</span><span>FULL REFERENCE v4.0</span></div>
        <h1>키워드 레퍼런스</h1>
        <input id="search-input" type="text" placeholder="키워드 검색 (영어 또는 한글)…" autocomplete="off">
        <div id="tab-bar"></div>
      </div>
    </div>
    <div id="content"></div>
  </div>
  <div id="builder">
    <div id="builder-header">
      <div id="builder-title">프롬프트 빌더</div>
      <div id="builder-sub">태그 클릭 → 여기 추가</div>
    </div>
    <div id="builder-tags"></div>
    <div id="builder-footer">
      <div id="sep-row">
        <span>구분자</span>
        <button class="sep-btn active" onclick="setSep(', ')">쉼표</button>
        <button class="sep-btn" onclick="setSep(' ')">공백</button>
        <button class="sep-btn" onclick="setSep('\n')">줄바꿈</button>
      </div>
      <div id="builder-preview">태그를 클릭하면 여기에 프롬프트가 만들어져요</div>
      <div id="builder-count"></div>
      <div id="builder-actions">
        <button class="btn-copy-all" id="btn-copy" onclick="copyAll()" disabled>전체 복사</button>
        <button class="btn-clear" id="btn-clear" onclick="clearAll()" disabled>초기화</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>

  renderBuilder(); render();
}
function removeBuilderItem(id) { builderItems = builderItems.filter(i => i.id !== id); renderBuilder(); render(); }

function shuffleArr(arr) {
  const copy = arr.slice();
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
  }
  return copy;
}
function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickN(arr, n) { return shuffleArr(arr).slice(0, n); }
function pickTwoFromPools(poolA, poolB) {
  const a = pickOne(poolA);
  const restB = poolB.filter(function(t) { return t[0] !== a[0]; });
  const b = pickOne(restB.length ? restB : poolB);
  return [a, b];
}
function currentProfile() { return GENRE_PROFILES.find(function(p) { return p.id === randomGenreId; }); }
function fusionProfiles() {
  return [GENRE_PROFILES.find(function(p) { return p.id === fusionPair[0]; }), GENRE_PROFILES.find(function(p) { return p.id === fusionPair[1]; })];
}
function fusionLabel() {
  const ab = fusionProfiles();
  return ab[0].emoji + ' ' + ab[0].label + '  ×  ' + ab[1].emoji + ' ' + ab[1].label;
}
function generateCombo(genreId, prev) {
  const p = GENRE_PROFILES.find(function(g) { return g.id === genreId; });
  prev = prev || {};
  return {
    genre: p.genreTag,
    energy: (randomLocks.energy && prev.energy) ? prev.energy : pickOne(excludeDefaults(p.pools.energy)),
    instruments: (randomLocks.instrument && prev.instruments) ? prev.instruments : pickN(excludeDefaults(p.pools.instrument), 2),
    production: (randomLocks.production && prev.production) ? prev.production : pickOne(excludeDefaults(p.pools.production)),
    vocal: (randomLocks.vocal && prev.vocal) ? prev.vocal : pickOne(excludeDefaults(p.pools.vocal)),
    groove: (randomLocks.groove && prev.groove) ? prev.groove : pickOne(excludeDefaults(p.pools.groove))
  };
}
function generateFusionCombo(prev, keepPair) {
  if (!keepPair || !fusionPair) fusionPair = shuffleArr(GENRE_PROFILES.map(function(p) { return p.id; })).slice(0, 2);
  const ab = fusionProfiles(); const A = ab[0]; const B = ab[1];

    instruments: (randomLocks.instrument && prev.instruments) ? prev.instruments : pickTwoFromPools(excludeDefaults(A.pools.instrument), excludeDefaults(B.pools.instrument)),
    production: (randomLocks.production && prev.production) ? prev.production : pickOne(excludeDefaults(B.pools.production)),
    vocal: (randomLocks.vocal && prev.vocal) ? prev.vocal : pickOne(excludeDefaults(A.pools.vocal)),
    groove: (randomLocks.groove && prev.groove) ? prev.groove : pickOne(excludeDefaults(B.pools.groove))
  };
}
function setComboMode(mode) {
  comboMode = mode;
  if (mode === 'fusion') {
    randomCombo = generateFusionCombo(null, false);
  } else if (mode === 'fusionPick') {
    fusionPickIds = [];
    randomCombo = null;
  } else {
    randomCombo = generateCombo(randomGenreId);
  }
  render();
}
function selectRandomGenre(id) { randomGenreId = id; comboMode = 'single'; randomCombo = generateCombo(id); render(); }
function rerollFusionPair() { randomCombo = generateFusionCombo(randomCombo, false); render(); }
// fusionPick 모드: 장르 칩을 최대 2개까지 직접 골라 그 조합으로 나머지 항목을 랜덤 생성한다.
// 이미 2개가 선택된 상태에서 새 칩을 고르면 가장 먼저 골랐던 것을 밀어낸다(최근 2개 유지).
function toggleFusionPickGenre(id) {
  const idx = fusionPickIds.indexOf(id);
  if (idx !== -1) {
    fusionPickIds.splice(idx, 1);
  } else {
    fusionPickIds.push(id);
    if (fusionPickIds.length > 2) fusionPickIds.shift();
  }
  if (fusionPickIds.length === 2) {
    fusionPair = fusionPickIds.slice();
    randomCombo = generateFusionCombo(null, true);
  } else {
    randomCombo = null;
  }
  render();
}
function shuffleAll() {
  if (comboMode === 'fusion') {
    randomCombo = generateFusionCombo(randomCombo, false);
  } else if (comboMode === 'fusionPick') {
    if (fusionPickIds.length < 2) return;
    randomCombo = generateFusionCombo(randomCombo, true);
  } else {
    randomCombo = generateCombo(randomGenreId, randomCombo);
  }
  render();
}
function toggleLock(cat) { randomLocks[cat] = !randomLocks[cat]; render(); }
function rerollCategory(cat) {
  if (comboMode === 'fusion' || comboMode === 'fusionPick') {
    const ab = fusionProfiles(); const A = ab[0]; const B = ab[1];
    if (cat === 'energy') randomCombo.energy = pickOne(excludeDefaults(A.pools.energy));
    else if (cat === 'instrument') randomCombo.instruments = pickTwoFromPools(excludeDefaults(A.pools.instrument), excludeDefaults(B.pools.instrument));
    else if (cat === 'production') randomCombo.production = pickOne(excludeDefaults(B.pools.production));
    else if (cat === 'vocal') randomCombo.vocal = pickOne(excludeDefaults(A.pools.vocal));
    else if (cat === 'groove') randomCombo.groove = pickOne(excludeDefaults(B.pools.groove));
  } else {
    const p = currentProfile();
    if (cat === 'energy') randomCombo.energy = pickOne(excludeDefaults(p.pools.energy));
    else if (cat === 'instrument') randomCombo.instruments = pickN(excludeDefaults(p.pools.instrument), 2);
    else if (cat === 'production') randomCombo.production = pickOne(excludeDefaults(p.pools.production));
    else if (cat === 'vocal') randomCombo.vocal = pickOne(excludeDefaults(p.pools.vocal));
    else if (cat === 'groove') randomCombo.groove = pickOne(excludeDefaults(p.pools.groove));
  }
  render();
}
function comboToItems() {
  const c = randomCombo;
  const genreItems = Array.isArray(c.genre[0]) ? c.genre : [c.genre];
  const defaults = includeDefaults ? BASE_DEFAULTS : [];
  return genreItems.concat([c.energy]).concat(c.instruments).concat([c.production, c.vocal, c.groove]).concat(defaults);
}
function toggleIncludeDefaults() { includeDefaults = !includeDefaults; render(); }
function addComboToBuilder() {
  comboToItems().forEach(function(t) {
    if (!isInBuilder(t[0])) builderItems.push({ id: Date.now() + Math.random(), en: t[0], ko: t[1] });
  });
  renderBuilder(); render();
  showToast('✓ 조합 전체를 빌더에 추가했어요');
}
function copyCombo() {
  const text = comboToItems().map(function(t) { return t[0]; }).join(separator);
  navigator.clipboard.writeText(text).catch(function() {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  showToast('✓ 조합 복사 완료!');
}
function renderRandomTab(tab) {
  if (comboMode === 'fusion' && !fusionPair) randomCombo = generateFusionCombo(null, false);
  if (comboMode === 'single' && !randomCombo) randomCombo = generateCombo(randomGenreId);

  const isFusionLike = comboMode === 'fusion' || comboMode === 'fusionPick';
  const rowColor = isFusionLike ? (randomCombo ? fusionProfiles()[0].color : '#c8a97e') : currentProfile().color;

  const modeToggle = '<div class="mode-toggle">' +
    '<button class="mode-btn' + (comboMode === 'single' ? ' active' : '') + '" onclick="setComboMode(\'single\')">🎯 장르 선택</button>' +
    '<button class="mode-btn' + (comboMode === 'fusion' ? ' active' : '') + '" onclick="setComboMode(\'fusion\')">🔀 랜덤 믹스 (2개 장르 퓨전)</button>' +
    '<button class="mode-btn' + (comboMode === 'fusionPick' ? ' active' : '') + '" onclick="setComboMode(\'fusionPick\')">🎨 장르 2개 직접 선택</button>' +
    '</div>';
  const genreChips = GENRE_PROFILES.map(function(p) {
    const active = comboMode === 'single' && p.id === randomGenreId;
    return '<button class="genre-chip' + (active ? ' active' : '') + '"' +
      ' style="' + (active ? 'background:' + p.color + ';border-color:' + p.color + ';' : '') + '"' +
      ' onclick="selectRandomGenre(\'' + p.id + '\')">' + esc(p.emoji + ' ' + p.label) + '</button>';
  }).join('');
  const fusionPickChips = GENRE_PROFILES.map(function(p) {
    const active = fusionPickIds.indexOf(p.id) !== -1;
    return '<button class="genre-chip' + (active ? ' active' : '') + '"' +
      ' style="' + (active ? 'background:' + p.color + ';border-color:' + p.color + ';' : '') + '"' +
      ' onclick="toggleFusionPickGenre(\'' + p.id + '\')">' + esc(p.emoji + ' ' + p.label) + '</button>';
  }).join('');
  let selectorHtml;
  if (comboMode === 'fusion') {
    selectorHtml = '<div class="fusion-info">🔀 ' + esc(fusionLabel()) +
      '<button class="fusion-reroll-btn" onclick="rerollFusionPair()" title="다른 장르 조합 뽑기">🎲 다른 조합</button></div>';
  } else if (comboMode === 'fusionPick') {
    selectorHtml = '<p class="tab-desc" style="margin:-4px 0 10px;">장르를 2개 선택하세요 (' + fusionPickIds.length + '/2 선택됨)</p>' +
      '<div class="genre-picker">' + fusionPickChips + '</div>';
  } else {
    selectorHtml = '<div class="genre-picker">' + genreChips + '</div>';
  }

  if (comboMode === 'fusionPick' && !randomCombo) {
    return '<p class="tab-desc">' + esc(tab.desc) + '</p>' + modeToggle + selectorHtml;
  }

  const shuffleLabel = comboMode === 'single' ? '🎲 랜덤 조합 생성' : '🎲 새로운 퓨전 조합 생성';
  function catRow(catKey, label, items, lockable) {
    const btns = lockable ?
      '<div class="combo-cat-btns">' +
      '<button class="combo-icon-btn' + (randomLocks[catKey] ? ' locked' : '') + '" onclick="toggleLock(\'' + catKey + '\')" title="고정/해제">' + (randomLocks[catKey] ? '🔒' : '🔓') + '</button>' +
      '<button class="combo-icon-btn" onclick="rerollCategory(\'' + catKey + '\')" title="다시 뽑기">🎲</button>' +
      '</div>' : '';
    const tagsHtml = items.map(function(t) { return renderTag(t[0], t[1], { tabColor: rowColor }); }).join('');
    return '<div class="combo-category">' +
      '<div class="combo-cat-header"><span class="combo-cat-label">' + esc(label) + '</span>' + btns + '</div>' +
      '<div class="tag-list">' + tagsHtml + '</div></div>';
  }
  const genreRowItems = isFusionLike ? randomCombo.genre : [randomCombo.genre];
  const genreRowLabel = isFusionLike ? '장르 · 퓨전' : '장르';
  const defaultsToggle = '<label class="defaults-toggle">' +
    '<input type="checkbox"' + (includeDefaults ? ' checked' : '') + ' onchange="toggleIncludeDefaults()">' +
    '고정 기본값(스튜디오 녹음, 노 리버브 등) 항상 포함' +
    '</label>';
  const defaultsRow = includeDefaults ? catRow('defaults', '기본값 · 항상 포함', BASE_DEFAULTS, false) : '';
  return '<p class="tab-desc">' + esc(tab.desc) + '</p>' +
    modeToggle + selectorHtml + defaultsToggle +
    '<button id="shuffle-btn" onclick="shuffleAll()">' + shuffleLabel + '</button>' +
    catRow('genre', genreRowLabel, genreRowItems, false) +
    defaultsRow +
    catRow('energy', '에너지 / 템포', [randomCombo.energy], true) +
    catRow('instrument', '악기', randomCombo.instruments, true) +
    catRow('production', '프로덕션', [randomCombo.production], true) +
    catRow('vocal', '보컬', [randomCombo.vocal], true) +
    catRow('groove', '멜로디 / 그루브', [randomCombo.groove], true) +
    '<div class="combo-actions">' +
    '<button class="btn-combo-add" onclick="addComboToBuilder()">＋ 전체 빌더에 추가</button>' +
    '<button class="btn-combo-copy" onclick="copyCombo()">조합 복사</button>' +
    '</div>';
}

// ═══ RENDER ═══
function renderTabBar(search) {
  const bar = document.getElementById('tab-bar');
  if (search) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  bar.innerHTML = TABS.map(t =>
    '<button class="tab-btn' + (t.id === activeTab ? ' active' : '') + '"' +
    ' style="' + (t.id === activeTab ? 'background:' + t.color + ';' : '') + '"' +
    ' onclick="switchTab(\'' + t.id + '\')">' + esc(t.label) + '</button>'
  ).join('');
}
function renderTag(en, ko, opts) {
  const danger = opts.danger; const info = opts.info; const tabColor = opts.tabColor;
  const badge = opts.badge; const isCustom = opts.isCustom; const customKey = opts.customKey;
  const sel = isInBuilder(en);
  let bg = '#1a1a1a', col = '#bbb', border = '#252525';
  if (danger) { bg = '#1e1212'; col = '#d07777'; border = '#3a1818'; }
  else if (info) { bg = '#101820'; col = '#88b8d0'; border = '#1a3040'; }
  const selMark = sel ? ' ✓' : '';
  const classes = ['tag-main', danger ? 'danger' : '', info ? 'info' : '', isCustom ? 'custom' : '', sel ? 'selected' : ''].filter(Boolean).join(' ');
  const badgeHtml = badge ? '<span class="search-badge">' + esc(badge) + '</span>' : '';
  const deleteBtn = (isCustom && customKey) ?
    '<button class="tag-delete-btn" onclick="event.stopPropagation();deleteCustomTag(\'' + esc(customKey) + '\',\'' + esc(en) + '\')" title="삭제">×</button>' : '';
  const enColor = sel ? 'var(--accent)' : col;
  return '<span class="tag-wrap">' +
    '<button class="' + classes + '" style="background:' + bg + ';border-color:' + border + ';" onclick="toggleBuilder(\'' + esc(en) + '\',\'' + esc(ko) + '\')" title="' + (sel ? '빌더에서 제거' : '빌더에 추가') + '">' +
    '<span class="tag-en" style="color:' + enColor + ';">' + esc(en) + selMark + badgeHtml + '</span>' +
    '</button>' +
    '<span class="tag-ko">' + esc(ko) + '</span>' +
    deleteBtn + '</span>';
}
function renderGroup(g, tabId, tabColor) {
  const key = tabId + '__' + g.label;
  const extras = customTags[key] || [];
  const allTags = g.tags.concat(extras);
  const labelCol = g.danger ? '#d07777' : g.info ? '#88b8d0' : tabColor;
  const noteHtml = g.note ? '<span class="group-note">' + esc(g.note) + '</span>' : '';
  const addFormHtml = (addingTo === key) ?
    '<div class="add-form"><input class="add-input" id="add-input-' + CSS.escape(key) + '" type="text" placeholder="태그 입력 후 Enter"' +
    ' onkeydown="if(event.key===\'Enter\') addCustomTag(\'' + esc(key) + '\',\'' + esc(tabColor) + '\')">' +
    '<button class="add-submit" style="background:' + tabColor + ';" onclick="addCustomTag(\'' + esc(key) + '\',\'' + esc(tabColor) + '\')">추가</button></div>' : '';
  const tagsHtml = allTags.map(function(t) {
    const en = t[0], ko = t[1];
    const isCust = extras.some(function(e) { return e[0] === en; });
    return renderTag(en, ko, {danger: g.danger, info: g.info, tabColor, badge: null, isCustom: isCust, customKey: isCust ? key : null});
  }).join('');
  return '<div class="group">' +
    '<div class="group-header"><span class="group-label" style="color:' + labelCol + ';">' + esc(g.label) + '</span>' + noteHtml +
    '<div class="group-divider"></div>' +
    '<button class="group-add-btn" onclick="toggleAdd(\'' + esc(key) + '\')" title="태그 추가">+</button></div>' +
    '<div class="tag-list">' + tagsHtml + '</div>' + addFormHtml + '</div>';
}
function renderTabContent(tab) {
  if (tab.id === 'random') return renderRandomTab(tab);
  return '<p class="tab-desc">' + esc(tab.desc) + '</p>' +
    tab.groups.map(function(g) { return renderGroup(g, tab.id, tab.color); }).join('');
}
function renderSearchResults(query) {
  const q = query.toLowerCase();
  const results = [];
  TABS.forEach(function(tb) {
    tb.groups.forEach(function(g) {
      g.tags.forEach(function(t) {
        if (t[0].toLowerCase().includes(q) || t[1].toLowerCase().includes(q)) {
          results.push({tb, g, en: t[0], ko: t[1]});
        }
      });
    });
  });
  if (!results.length) return '<p class="no-results">결과 없음</p>';
  return '<div class="search-count">' + results.length + '개 결과</div><div class="tag-list">' +
    results.map(function(r) {
      return renderTag(r.en, r.ko, {danger: r.g.danger, info: r.g.info, tabColor: r.tb.color,
        badge: r.tb.label.slice(0, 2) + ' ' + r.g.label, isCustom: false, customKey: null});
    }).join('') + '</div>';
}
function render() {
  const query = document.getElementById('search-input').value.trim();
  renderTabBar(query);
  const content = document.getElementById('content');
  if (query) {
    content.innerHTML = renderSearchResults(query);
  } else {
    const tab = TABS.find(function(t) { return t.id === activeTab; });
    content.innerHTML = renderTabContent(tab);
    if (addingTo) {
      const inp = document.getElementById('add-input-' + CSS.escape(addingTo));
      if (inp) inp.focus();
    }
  }
}

// ═══ ACTIONS ═══
function switchTab(id) { activeTab = id; addingTo = null; render(); }
function toggleAdd(key) { addingTo = (addingTo === key) ? null : key; render(); }
function deleteCustomTag(key, en) {
  customTags[key] = (customTags[key] || []).filter(function(t) { return t[0] !== en; });
  render();
}
function addCustomTag(key, tabColor) {
  const inp = document.getElementById('add-input-' + CSS.escape(key));
  if (!inp || !inp.value.trim()) return;
  customTags[key] = (customTags[key] || []).concat([[inp.value.trim(), '커스텀']]);
  addingTo = null; render();
}

// ═══ INIT ═══
document.getElementById('search-input').addEventListener('input', render);
render();
renderBuilder();
</script>
</body>
</html>
