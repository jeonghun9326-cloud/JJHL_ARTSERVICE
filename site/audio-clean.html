<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오디오 클리너 — JJHL</title>
  <script>
    (function () {
      var t = localStorage.getItem('jjhl-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .ac-panel { display: flex; flex-direction: column; gap: 18px; max-width: 820px; }

    .ac-hint { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; margin: -6px 0 0; }

    .ac-upload-row { display: flex; flex-wrap: wrap; gap: 16px; }
    .ac-upload-row .form-field { flex: 1 1 260px; }

    /* 트랜스포트(재생/정지) 바 */
    .ac-transport {
      display: none; align-items: center; gap: 12px; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    }
    .ac-transport-btn {
      background: var(--bg3, var(--card)); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 7px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: var(--transition);
    }
    .ac-transport-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ac-time-display { font-size: 0.8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .ac-bypass-row { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-muted); margin-left: auto; }

    /* 트랙(채널 스트립) */
    .ac-track {
      display: none; flex-direction: column; gap: 12px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    }
    .ac-track-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ac-track-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .ac-track-filename { font-size: 0.75rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; max-width: 200px; white-space: nowrap; }
    .ac-ms-btn {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3, var(--card));
      color: var(--text-muted); font-size: 0.72rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .ac-ms-btn.mute.active { background: #ef4444; border-color: #ef4444; color: #fff; }
    .ac-ms-btn.solo.active { background: #eab308; border-color: #eab308; color: #111; }
    .ac-track-volume-wrap { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 0.75rem; color: var(--text-muted); }
    .ac-track-volume-wrap input[type="range"] { width: 110px; }

    .ac-section-label { font-size: 0.85rem; font-weight: 600; color: var(--text); margin: 2px 0 -6px; }
    .ac-section-desc { font-size: 0.76rem; color: var(--text-muted); line-height: 1.6; margin: -4px 0 0; }

    .ac-presets { display: flex; flex-wrap: wrap; gap: 8px; }
    .ac-preset-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
      padding: 7px 12px; font-size: 0.8rem; cursor: pointer; font-family: inherit; transition: var(--transition);
    }
    .ac-preset-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* 드래그(range)뿐 아니라 숫자를 직접 입력할 수 있는 값 표시용 인풋 */
    .ac-num-input {
      width: 52px; background: var(--bg3, var(--card)); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); font-family: inherit; font-size: 0.75rem; text-align: right; padding: 2px 4px;
      font-variant-numeric: tabular-nums;
    }
    .ac-num-input:focus { outline: none; border-color: var(--accent); }
    .ac-value-wrap { display: inline-flex; align-items: center; gap: 4px; }

    .ac-eq-grid { display: flex; gap: 14px; flex-wrap: wrap; padding: 6px 0; }
    .ac-eq-band { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px; cursor: help; }
    .ac-eq-band input[type="range"] { writing-mode: vertical-lr; direction: rtl; width: 6px; height: 100px; }
    .ac-eq-band .ac-num-input { width: 44px; padding: 1px 2px; text-align: center; }
    .ac-eq-band .ac-eq-freq { font-size: 0.7rem; color: var(--text-muted); }

    .ac-comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .ac-slider-row { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; color: var(--text-muted); cursor: help; }
    .ac-slider-row .ac-slider-label { display: flex; justify-content: space-between; align-items: center; }
    .ac-slider-row input[type="range"] { width: 100%; }

    .ac-master-row { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; color: var(--text-muted); max-width: 280px; }
    .ac-master-row .ac-slider-label { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">JJHL</a>
      <nav class="nav">
        <a href="index.html" class="nav-link">홈</a>
        <a href="music.html" class="nav-link">음악</a>
        <a href="community.html" class="nav-link">커뮤니티</a>
      </nav>
      <div class="auth-area" id="authArea"></div>
      <button class="theme-toggle" id="themeToggle" aria-label="테마 변경"></button>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="page-hero">
        <h1>오디오 클리너</h1>
        <p>보컬과 반주를 각각 올려서 리퍼/큐베이스처럼 트랙별로 들어보고, EQ·컴프레서로 다듬어보세요</p>
      </div>

      <section class="ac-panel" id="manualPanel">
        <p class="ac-hint">
          전부 브라우저 안에서 처리돼서 서버가 필요 없고, 파일이 어디로도 업로드되지 않습니다.
          AI 기반 노이즈 제거는 아직 지원하지 않고, 트랙별 EQ·컴프레서·볼륨 조정만 가능합니다.
          보컬/반주 중 하나만 있어도 괜찮습니다.
        </p>

        <div class="ac-upload-row">
          <div class="form-field">
            <label for="vocalFileInput">보컬 파일</label>
            <input type="file" id="vocalFileInput" class="form-input" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg">
          </div>
          <div class="form-field">
            <label for="instFileInput">반주 파일</label>
            <input type="file" id="instFileInput" class="form-input" accept="audio/*,.wav,.mp3,.flac,.m4a,.ogg">
          </div>
        </div>

        <div class="ac-transport" id="acTransport">
          <button class="ac-transport-btn" type="button" id="playPauseBtn">▶ 재생</button>
          <button class="ac-transport-btn" type="button" id="stopBtn">⏹ 처음으로</button>
          <span class="ac-time-display" id="timeDisplay">00:00 / 00:00</span>
          <label class="ac-bypass-row">
            <input type="checkbox" id="bypassToggle"> 우회(처리 전 원본 그대로 듣기)
          </label>
        </div>

        <div>
          <div class="ac-section-label">프리셋 (두 트랙에 한번에 적용)</div>
          <div class="ac-presets" id="acPresets">
            <button class="ac-preset-btn" type="button" data-preset="flat">기본값</button>
            <button class="ac-preset-btn" type="button" data-preset="vocalClear">보컬 또렷하게</button>
            <button class="ac-preset-btn" type="button" data-preset="bassBoost">저음 보강</button>
            <button class="ac-preset-btn" type="button" data-preset="loud">라우드니스 업</button>
          </div>
        </div>

        <div id="acTracks"></div>

        <div class="ac-master-row">
          <div class="ac-slider-label">
            <span>출력 볼륨 (전체 믹스)</span>
            <span class="ac-value-wrap">
              <input type="number" id="outputGainVal" class="ac-num-input" min="-12" max="12" step="0.1" value="0">
              <span>dB</span>
            </span>
          </div>
          <input type="range" id="outputGain" min="-12" max="12" step="0.1" value="0"
            title="보컬+반주를 합친 최종 결과물의 전체 음량입니다.">
        </div>

        <button class="btn-primary" id="manualExportBtn" type="button" style="justify-content:center" disabled>믹스해서 다운로드 (WAV)</button>
        <p class="ac-hint" id="manualExportStatus"></p>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 JJHL. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/audio-clean.js"></script>
</body>
</html>
